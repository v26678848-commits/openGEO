<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>OpenGEO</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23161a1f'/%3E%3Ccircle cx='16' cy='14' r='6' fill='none' stroke='%235aa9e6' stroke-width='3'/%3E%3Cpath d='M16 28l-6-8h12z' fill='%235aa9e6'/%3E%3C/svg%3E">
<style>
:root{--bg:#0e1114;--s1:#161a1f;--s2:#1d2329;--bd:#2b333c;--tx:#e7eaee;--mu:#9aa6b2;--ac:#5aa9e6;--acx:#0e1114;--ok:#5fbf8a;--bad:#e5766f;--warn:#e0b85a;--r:6px;--top:48px;--navh:56px;color-scheme:dark}
:root[data-theme=light]{--bg:#f3f5f7;--s1:#fff;--s2:#eef1f4;--bd:#d3d9df;--tx:#171b20;--mu:#59636e;--ac:#1f6fb5;--acx:#fff;--ok:#1f7a4a;--bad:#b3362f;--warn:#8a6414;color-scheme:light}
@media(prefers-color-scheme:light){:root[data-theme=system]{--bg:#f3f5f7;--s1:#fff;--s2:#eef1f4;--bd:#d3d9df;--tx:#171b20;--mu:#59636e;--ac:#1f6fb5;--acx:#fff;--ok:#1f7a4a;--bad:#b3362f;--warn:#8a6414;color-scheme:light}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
h1,h2,h3,h4{margin:.2em 0;line-height:1.25}h1{font-size:1.6rem}h2{font-size:1.1rem}h3{font-size:1rem}h4{font-size:.9rem;color:var(--mu);margin-top:.8em}
p{margin:.4em 0}ol{padding-left:1.2em;margin:.4em 0}li{margin:.2em 0}
a{color:var(--ac)}
.muted{color:var(--mu);font-size:.9em}.warn{color:var(--warn)}
button,input,select,textarea{font:inherit;color:inherit}
button{min-height:44px;padding:0 14px;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);cursor:pointer}
button:hover{border-color:var(--mu)}
button.primary{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button.danger{color:var(--bad);border-color:var(--bad)}
button.small{min-height:36px;padding:0 10px;font-size:.9em}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select,textarea{width:100%;min-height:44px;padding:8px 10px;background:var(--bg);border:1px solid var(--bd);border-radius:var(--r)}
textarea{resize:vertical}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--ac)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:.5em 0}

/* layout: mobile first */
#app{display:grid;height:100dvh;grid-template-rows:var(--top) 1fr var(--navh);grid-template-areas:"top" "content" "nav"}
#top{grid-area:top;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--s1);border-bottom:1px solid var(--bd);min-width:0}
.logo{letter-spacing:.04em}
.projbtn{min-height:36px;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#status{margin-left:auto;font-size:.8rem;color:var(--mu);text-align:right;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.save.saved{color:var(--ok)}.save.error{color:var(--bad)}.on{color:var(--ok)}.off{color:var(--warn)}
#nav{grid-area:nav;display:flex;background:var(--s1);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
.navb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-height:var(--navh);padding:2px;border:0;border-radius:0;background:none;font-size:.7rem;color:var(--mu)}
.navb .ic{font-size:1.2rem;line-height:1}
.navb[aria-current=page]{color:var(--ac);box-shadow:inset 0 2px 0 var(--ac)}
.navb.desk{display:none}
#list{grid-area:content;overflow:auto;padding:10px 12px;background:var(--bg);min-height:0}
#mapwrap{grid-area:content;position:relative;min-height:0}
#map{position:absolute;inset:0;background:var(--s2)}
#app:not([data-view=map]) #mapwrap{display:none}
#app[data-view=map] #list{display:none}
#detail{display:none;position:fixed;left:0;right:0;bottom:0;max-height:85dvh;background:var(--s1);border-top:2px solid var(--ac);z-index:20;overflow:auto;padding-bottom:env(safe-area-inset-bottom);flex-direction:column}
#detail.open{display:flex}
#app[data-view=map] #detail{max-height:45dvh;bottom:var(--navh)}
.dhead{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:var(--s1);border-bottom:1px solid var(--bd);z-index:1}
.dbody{padding:10px 12px 16px}
#fab{position:fixed;right:14px;bottom:calc(var(--navh) + 14px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--ac);color:var(--acx);font-size:1.8rem;border:0;z-index:15;box-shadow:0 2px 8px #0008;padding:0}
#app[data-view=map] #detail.open ~ #fab,#detail.open ~ #fab{display:none}
#app.focus #top,#app.focus #nav,#app.focus #detail,#app.focus #fab{display:none}
#app.focus{grid-template-rows:1fr;grid-template-areas:"content"}
#app.focus #list{display:none}#app.focus #mapwrap{display:block}

/* map overlay */
#mapbar{position:absolute;top:8px;left:8px;right:56px;display:flex;flex-wrap:wrap;gap:6px;z-index:5}
#mapbar button,#mapbar input{background:var(--s1);min-height:40px;box-shadow:0 1px 4px #0006}
#geo{display:flex;gap:6px;flex:1 1 220px;min-width:180px}
#mapname{background:var(--s1);padding:8px 10px;border-radius:var(--r);align-self:center;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#probe{position:absolute;left:8px;bottom:34px;right:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--s1);padding:6px 8px;border-radius:var(--r);border:1px solid var(--bd);z-index:5;font-variant-numeric:tabular-nums}
#probe[hidden],#mapmsg[hidden],#welcome[hidden]{display:none}
#probe button{min-height:36px;padding:0 10px;font-size:.9em}
#mapmsg{position:absolute;left:8px;right:8px;top:calc(8px + 92px);background:var(--s1);border:1px solid var(--warn);color:var(--warn);padding:8px 10px;border-radius:var(--r);z-index:4}
#legend{position:absolute;left:8px;bottom:6px;font-size:.75rem;background:var(--s1);padding:2px 8px;border-radius:var(--r);z-index:4;display:flex;gap:6px;align-items:center}
#cursor{position:absolute;right:8px;bottom:6px;font-size:.75rem;background:var(--s1);padding:2px 8px;border-radius:var(--r);z-index:4;font-variant-numeric:tabular-nums}
#cursor:empty{display:none}
.pin{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;min-height:0;padding:0;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--s1);color:var(--tx);border:2px solid var(--ac);font-size:.75rem;font-weight:700}
.pin>*{transform:rotate(45deg)}
button.pin{min-height:0}
.pin.sel{background:var(--ac);color:var(--acx);width:34px;height:34px}
.pin.probe{border-style:dashed;border-color:var(--warn)}
.pin.arch{opacity:.5}
.pin.mini{width:20px;height:20px;font-size:.65rem;flex:none}
.pin{text-align:center}
.pin::first-line{transform:none}

/* lists */
.lhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
.lhead input{flex:1 1 100%}
.item{display:flex;width:100%;gap:10px;align-items:center;text-align:left;padding:8px 10px;margin:0 0 6px;background:var(--s1);min-height:56px}
.item.sel{border-color:var(--ac);box-shadow:inset 3px 0 0 var(--ac)}
.item .txt{display:flex;flex-direction:column;min-width:0;flex:1}
.ttl{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--mu);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:.72rem;padding:2px 6px;border:1px solid var(--bd);border-radius:10px;color:var(--mu);white-space:nowrap}
.th,.ph{width:44px;height:44px;flex:none;border-radius:var(--r);object-fit:cover;background:var(--s2);display:inline-flex;align-items:center;justify-content:center;color:var(--mu)}
.dir{width:32px;height:32px;flex:none;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--mu);font-weight:700}
.dir.support{color:var(--ok);border-color:var(--ok)}.dir.contradict{color:var(--bad);border-color:var(--bad)}
.empty{padding:18px 12px;border:1px dashed var(--bd);border-radius:var(--r);text-align:center;color:var(--mu)}
.empty strong{color:var(--tx)}.empty .row{justify-content:center}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:10px 12px;margin:0 0 10px}
.card h3{margin-bottom:6px}
dl{display:grid;grid-template-columns:minmax(90px,35%) 1fr;gap:4px 10px;margin:.5em 0}
dt{color:var(--mu);font-size:.85em}dd{margin:0;overflow-wrap:anywhere;white-space:pre-line}
.stats{display:flex;flex-wrap:wrap;gap:6px}.stat{min-height:40px}
.coords{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:.5em 0;font-variant-numeric:tabular-nums}
.lnk{min-height:36px;border:0;background:none;color:var(--ac);padding:0 2px;text-align:left;text-decoration:underline}
.media{margin:0 0 8px;text-align:center}.media video,.media img.full{max-width:100%;max-height:50dvh;border-radius:var(--r);background:#000}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.logrow{padding:6px 0;border-bottom:1px solid var(--bd)}
.field{margin:0 0 10px}.field>label{display:block;margin-bottom:3px;font-size:.9em}
.chk{display:flex;gap:8px;align-items:center;margin:4px 0;min-height:32px}
.multi{max-height:160px;overflow:auto;border:1px solid var(--bd);border-radius:var(--r);padding:4px 8px}

/* dialogs, toast, welcome */
dialog.dlg{width:min(560px,100vw - 16px);max-height:calc(100dvh - 16px);padding:14px;background:var(--s1);color:var(--tx);border:1px solid var(--bd);border-radius:var(--r);overflow:auto}
dialog::backdrop{background:#000a}
.foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;position:sticky;bottom:-14px;background:var(--s1);padding:10px 0 4px;margin-top:8px}
.ask{white-space:pre-line}
.err{color:var(--bad);min-height:1.2em;margin:0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + 80px);max-width:min(92vw,520px);background:var(--s2);border:1px solid var(--bd);padding:10px 14px;border-radius:var(--r);z-index:100;display:none;box-shadow:0 2px 10px #0009}
#toast.show{display:block}#toast.bad{border-color:var(--bad)}
#welcome{position:fixed;inset:0;background:var(--bg);z-index:50;overflow:auto;padding:16px}
.wbox{max-width:640px;margin:4vh auto}
.hide-s{display:none}

@media(min-width:768px){
  #app{grid-template-columns:300px 1fr;grid-template-rows:var(--top) auto 1fr;grid-template-areas:"top top" "nav content" "list content"}
  #nav{flex-direction:column;border-top:0;border-right:1px solid var(--bd);padding:6px;gap:2px}
  .navb{flex:none;flex-direction:row;justify-content:flex-start;gap:10px;min-height:38px;padding:0 10px;font-size:.9rem;border-radius:var(--r)}
  .navb.desk{display:flex}
  .navb[aria-current=page]{background:var(--s2);box-shadow:inset 3px 0 0 var(--ac)}
  #list{grid-area:list;border-right:1px solid var(--bd);background:var(--s1)}
  .item{background:var(--bg)}
  #mapwrap,#app:not([data-view=map]) #mapwrap{display:block;grid-area:content;grid-row:2 / 4}
  #app[data-view=map] #list{display:block}
  #detail{left:auto;width:380px;top:var(--top);bottom:0;max-height:none;border-top:0;border-left:2px solid var(--ac)}
  #app[data-view=map] #detail{max-height:none;bottom:0}
  #fab{display:none}
  .hide-s{display:inline}
  #toast{bottom:24px}
  #mapbar{right:60px}
  #mapmsg{top:8px;left:auto;right:60px;max-width:320px;top:calc(8px + 48px)}
  #app.focus{grid-template-columns:1fr;grid-template-rows:1fr}
}
@media(min-width:1200px){
  #app{grid-template-columns:300px 1fr 360px;grid-template-areas:"top top top" "nav content detail" "list content detail"}
  #mapwrap,#app:not([data-view=map]) #mapwrap{grid-row:2 / 4}
  #detail,#detail.open{display:flex;position:static;grid-area:detail;grid-row:2 / 4;width:auto;border-top:0;border-left:1px solid var(--bd);max-height:none}
  #app[data-view=map] #detail{bottom:auto}
  #app.focus{grid-template-columns:1fr}
}
@media(max-width:767px){.item .sub{white-space:normal}}

/* Stage B: compact mobile controls */
.coord-copy { border: 0; padding: 0; background: transparent; color: inherit; font: inherit; text-align: left; text-decoration: underline dotted; text-underline-offset: 3px; cursor: copy; }
.stat { display: flex; flex-direction: column; align-items: flex-start; gap: .15rem; }
.stat strong { font-size: 1.1rem; }
@media (max-width: 600px) { #bFull { display: none; } }

/* OpenGEO field-work UI: calm, dense, readable, deliberately not decorative. */
:root{
  --bg:#11171b;
  --s1:#192127;
  --s2:#222d35;
  --bd:#33434d;
  --tx:#e8eef1;
  --mu:#9aabb4;
  --ac:#61c8bd;
  --acx:#10201f;
  --ok:#71c79b;
  --bad:#e47e79;
  --warn:#e4bd69;
  --r:10px;
  --top:56px;
  --navh:66px;
}
:root[data-theme=light]{
  --bg:#f1f4f5;
  --s1:#ffffff;
  --s2:#e8edef;
  --bd:#cbd5d9;
  --tx:#172126;
  --mu:#5e6d74;
  --ac:#167f78;
  --acx:#ffffff;
  --ok:#24784c;
  --bad:#b73f39;
  --warn:#856016;
}
@media(prefers-color-scheme:light){:root[data-theme=system]{
  --bg:#f1f4f5;--s1:#fff;--s2:#e8edef;--bd:#cbd5d9;--tx:#172126;--mu:#5e6d74;--ac:#167f78;--acx:#fff;--ok:#24784c;--bad:#b73f39;--warn:#856016;
}}
html{scroll-behavior:smooth}
body{font-size:14px;line-height:1.5;letter-spacing:.005em}
button,input,select,textarea{font-size:inherit}
button{border-radius:9px;border-color:var(--bd);transition:background-color .12s ease,border-color .12s ease,color .12s ease;box-shadow:none}
button:hover{border-color:var(--ac);background-color:var(--s2)}
button.primary{background:var(--ac);border-color:var(--ac);color:var(--acx)}
button.primary:hover{filter:brightness(1.06)}
button.quiet{background:transparent;border-color:transparent;color:var(--mu)}
button.secondary{background:var(--s2);border-color:var(--bd)}
button.icon-button{width:42px;min-width:42px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:1.35rem;font-weight:400;line-height:1}
button.small{border-radius:8px}
:focus-visible{outline:3px solid color-mix(in srgb,var(--ac) 65%,transparent);outline-offset:2px}
#top{padding:0 14px;gap:9px;background:var(--s1);border-bottom-color:var(--bd)}
.logo{font-size:.95rem;font-weight:800;letter-spacing:.075em;border-left:3px solid var(--ac);padding-left:8px;white-space:nowrap}
.projbtn{max-width:48%;min-height:38px;padding:0 10px;text-align:left;border-color:transparent;background:var(--s2);font-weight:600}
#status{font-size:.72rem;max-width:33%;line-height:1.15}
#status .save{display:inline-block;overflow:hidden;text-overflow:ellipsis;max-width:100%;vertical-align:middle}
#status .on,#status .off{font-size:.72rem}
#nav{background:var(--s1);border-color:var(--bd)}
.navb{color:var(--mu);font-size:.68rem;font-weight:600;letter-spacing:0;transition:color .12s ease,background-color .12s ease;min-width:0}
.navb .ic{font-size:1.18rem;line-height:1.2;margin-bottom:2px;color:currentColor}
.navb span:last-child{max-width:100%;overflow-wrap:anywhere;line-height:1.12;text-align:center}
.navb[aria-current=page]{color:var(--ac);box-shadow:inset 0 2px 0 var(--ac);background:color-mix(in srgb,var(--ac) 6%,transparent)}
#list{padding:14px 14px 24px;background:var(--bg);overscroll-behavior:contain}
.lhead{gap:10px;margin:2px 0 14px}
.lhead h2{font-size:1.1rem;font-weight:750;letter-spacing:-.02em;margin:0}
.lhead .row{margin:0}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:0 0 12px}
.card h3{font-size:.92rem;font-weight:750;letter-spacing:-.01em;margin:0 0 9px}
h1,h2,h3,h4{letter-spacing:-.015em}
.item{background:var(--s1);border-color:transparent;border-bottom-color:var(--bd);border-radius:9px;min-height:64px;padding:9px 10px;margin:0 0 5px;gap:11px}
.item:hover{background:var(--s2);border-color:var(--bd)}
.item.sel{background:color-mix(in srgb,var(--ac) 9%,var(--s1));border-color:var(--ac);box-shadow:inset 3px 0 0 var(--ac)}
.item .ttl{font-size:.9rem;line-height:1.3;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item .sub{font-size:.74rem;line-height:1.25;margin-top:2px}
.badge{border-radius:5px;font-size:.66rem;letter-spacing:.015em;padding:2px 6px;background:var(--s2)}
.th,.ph{border-radius:7px;width:46px;height:46px}
.empty{border:1px solid var(--bd);border-radius:12px;padding:22px 16px;background:var(--s1);text-align:left;color:var(--mu)}
.empty strong{display:block;font-size:1rem;margin-bottom:5px}
.empty p{line-height:1.5}
.empty .row{justify-content:flex-start}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{min-height:76px;justify-content:center;gap:3px;padding:10px 12px;border:1px solid var(--bd);border-left:3px solid var(--ac);border-radius:9px;background:var(--s1)}
.stat strong{font-size:1.45rem;line-height:1.05;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.035em}
.stat span{font-size:.75rem;color:var(--mu);line-height:1.2}
dl{grid-template-columns:minmax(100px,36%) minmax(0,1fr);gap:7px 12px;margin:.65em 0}
dt{font-size:.78rem;line-height:1.35}
dd{font-size:.88rem;line-height:1.4}
.coords{padding:2px 0;gap:10px}
.coord-copy{border-radius:4px;font-variant-numeric:tabular-nums;text-underline-offset:4px}
.logrow{font-size:.86rem;padding:8px 0}
#detail{background:var(--s1);border-top:2px solid var(--ac);box-shadow:0 -8px 30px #0002}
.dhead{min-height:51px;padding:7px 14px;border-bottom-color:var(--bd)}
.dhead strong{font-size:.88rem;letter-spacing:.015em}
.dbody{padding:14px 14px 20px}
.dbody>h3,.dbody>div>h3{font-size:1.12rem;line-height:1.25;margin:2px 0 12px;overflow-wrap:anywhere}
.detail-actions{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;margin:18px 0 2px;padding-top:12px;border-top:1px solid var(--bd)}
.detail-actions button{flex:1 1 auto}
.detail-actions button:last-child{flex:0 0 auto;min-width:68px}
#fab{width:54px;height:54px;right:16px;bottom:calc(var(--navh) + 14px + env(safe-area-inset-bottom));border:0;box-shadow:0 4px 14px #0005;font-size:1.75rem}
#app[data-view=map] #fab{display:none}
#app[data-view=overview] #fab{display:none}
#map{background:#d7dee0}
#mapbar{left:10px;right:10px;top:10px;gap:7px;align-items:center}
#mapbar button,#mapbar input{min-height:42px;border-radius:9px;box-shadow:0 2px 8px #07101726}
#mapbar #bAdd{font-weight:700}
#geo{flex:1 1 230px;min-width:0}
#geoq{background:var(--s1);min-width:0}
#bFit{width:42px;min-width:42px;padding:0;font-size:1.2rem}
#probe{left:10px;right:10px;bottom:40px;gap:8px;padding:9px;background:var(--s1);border-color:var(--bd);box-shadow:0 3px 12px #0002;border-radius:11px}
#probe .map-coord{flex:1 1 100%;min-height:34px;white-space:normal;font-size:.88rem}
#probe .probe-create{flex:1 1 auto}
#probe .probe-close{flex:0 0 42px}
#legend{left:10px;bottom:8px;padding:5px 8px;border:1px solid var(--bd);font-size:.68rem}
#cursor{right:10px;bottom:8px;padding:5px 8px;font-size:.68rem;border:1px solid var(--bd)}
#mapmsg{border-radius:10px;box-shadow:0 2px 10px #0002}
#toast{border-radius:10px;font-size:.88rem;bottom:calc(var(--navh) + 82px + env(safe-area-inset-bottom));box-shadow:0 4px 14px #0004}
dialog.dlg{border-radius:14px;padding:18px;box-shadow:0 16px 45px #0005}
dialog.dlg h2{font-size:1.1rem;margin:0 0 12px}
.foot{gap:8px;padding:12px 0 4px;margin-top:12px}
.foot button{min-width:92px}
.field{margin-bottom:14px}
.field>label{font-weight:650;font-size:.84rem;margin-bottom:5px}
input,select,textarea{border-radius:8px;border-color:var(--bd);background:var(--bg)}
input::placeholder,textarea::placeholder{color:var(--mu);opacity:.8}
.multi{border-color:var(--bd);border-radius:9px}
.dir{width:36px;height:36px}
.pin{border-radius:50% 50% 50% 12%;box-shadow:none}
.media video,.media img.full{border-radius:8px}
#welcome{padding:18px;background:var(--bg)}
.wbox{max-width:560px;margin:5vh auto}
.wbox h1{font-size:2rem;letter-spacing:-.04em;margin-bottom:8px}
.wbox>p{max-width:58ch;line-height:1.6}
.wbox>.row{margin:18px 0;align-items:stretch}
.wbox>.row button{flex:1 1 160px}
.wbox .item{background:var(--s1)}

/* Overview: one clear primary action, project metadata is available but folded away. */
.overview>.lhead{margin-bottom:10px}
.project-hero{background:var(--s1);border:1px solid var(--bd);border-radius:13px;padding:16px;margin-bottom:14px}
.project-hero-top{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:9px}
.eyebrow{font-size:.68rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--mu)}
.status-pill{display:inline-flex;align-items:center;max-width:60%;padding:4px 8px;border:1px solid var(--bd);border-radius:5px;background:var(--s2);font-size:.7rem;font-weight:700;line-height:1.2}
.status-done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--bd))}
.status-archive{color:var(--mu)}
.status-review{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--bd))}
.project-name{font-size:clamp(1.25rem,4.5vw,1.75rem);font-weight:780;line-height:1.12;overflow-wrap:anywhere;margin:0 0 9px}
.project-description{font-size:.9rem;line-height:1.55;margin:0 0 8px;overflow-wrap:anywhere}
.project-goal{margin:12px 0 0;padding:10px 12px;border-left:2px solid var(--ac);background:var(--s2);border-radius:0 7px 7px 0}
.project-goal p{margin:3px 0 0;font-size:.87rem;white-space:pre-line;overflow-wrap:anywhere}
.meta-label{font-size:.65rem;font-weight:800;letter-spacing:.09em;color:var(--mu)}
.project-hero-actions{display:flex;align-items:stretch;gap:7px;flex-wrap:wrap;margin-top:15px}
.project-hero-actions .quiet{padding-inline:9px}
.local-note{font-size:.72rem;color:var(--mu);line-height:1.35;margin:12px 0 0;display:flex;align-items:flex-start;gap:4px}
.local-dot{font-size:.65rem;color:var(--ac);line-height:1.55}
.dashboard-section{margin:0 0 14px}
.section-heading{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 2px 9px}
.section-heading h3{font-size:.92rem;margin:0;font-weight:750}
.section-heading .muted{font-size:.65rem;text-align:right}
.next-step{padding:15px;background:var(--s2);border:1px solid var(--bd);border-radius:12px;margin:0 0 14px}
.next-step .eyebrow{display:block;margin-bottom:7px;color:var(--ac)}
.next-step h3{font-size:1rem;line-height:1.3;margin:0 0 6px}
.next-step p{font-size:.84rem;line-height:1.55;color:var(--mu);margin:0 0 13px}
.next-step-button{width:100%;min-height:42px;background:var(--s1)}
.fold-panel{border:1px solid var(--bd);border-radius:11px;background:var(--s1);margin-bottom:12px;overflow:hidden}
.fold-panel>summary{cursor:pointer;list-style:none;min-height:48px;padding:13px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.85rem;font-weight:700}
.fold-panel>summary::-webkit-details-marker{display:none}
.fold-panel>summary::after{content:'＋';color:var(--ac);font-size:1.1rem;font-weight:400}
.fold-panel[open]>summary::after{content:'−'}
.fold-content{padding:0 14px 14px;border-top:1px solid var(--bd)}
.metadata-block{padding:12px 0 6px}
.metadata-block h3,.settings-block h3{font-size:.87rem;margin:0 0 8px}
.settings-block{border-top:1px solid var(--bd);padding-top:13px;margin-top:7px}
.settings-grid{display:grid;grid-template-columns:1fr;gap:0}
.settings-block .field{margin-bottom:10px}
.settings-block select,.settings-block input{min-height:42px}
.storage-note,.privacy-note{font-size:.75rem;line-height:1.45;margin:4px 0 0}
.backup-note{font-size:.74rem;line-height:1.5;color:var(--mu);padding:0 2px;margin:8px 0 4px}

@media(min-width:768px){

  #mapname{max-width:180px}
  #geo{flex:1 1 260px;max-width:440px}

  .project-hero{padding:16px}
}

  #status{max-width:104px}

  #probe{bottom:38px}

  .project-hero{padding:12px}
  .stat{padding:9px}

}

@media(min-width:768px) and (max-width:1023px){

  #geo{flex:1 1 260px;max-width:none}

}

#mapname{display:none}
